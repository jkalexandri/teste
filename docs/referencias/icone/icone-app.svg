<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25D366"/><stop offset="1" stop-color="#2dd4ff"/></linearGradient>
    <radialGradient id="bg" cx=".3" cy=".25" r="1"><stop offset="0" stop-color="#0d2a26"/><stop offset="1" stop-color="#050d18"/></radialGradient>
    <linearGradient id="feixeV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25D366" stop-opacity="0"/><stop offset="1" stop-color="#7dffb5"/></linearGradient>
    <linearGradient id="feixeC" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#a8f0ff"/></linearGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- circuitos -->
  <g stroke="#25D366" stroke-opacity=".22" stroke-width="5" fill="none">
    <path d="M0 140 H120 L170 90 H260"/><circle cx="270" cy="90" r="9"/>
    <path d="M512 380 H400 L350 430 H260"/><circle cx="250" cy="430" r="9"/>
    <path d="M40 512 V440 L80 400"/><path d="M470 0 V70 L430 110"/>
  </g>
  <!-- luzes passando (congeladas no ícone; animadas na abertura do app) -->
  <g filter="url(#brilho)" stroke-linecap="round" fill="none" stroke-width="7">
    <path d="M60 140 H120 L150 110" stroke="url(#feixeV)"/>
    <path d="M480 380 H400 L380 400" stroke="url(#feixeC)"/>
  </g>
  <circle cx="270" cy="90" r="9" fill="#7dffb5" filter="url(#brilho)"/>
  <text x="256" y="318" text-anchor="middle" font-family="Sora, Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="210" letter-spacing="-8" fill="url(#g)">FP</text>
</svg>
